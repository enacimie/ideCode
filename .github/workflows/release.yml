name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release-${{ github.ref }}

env:
  RELEASE_BODY: >-
    Binarios generados automáticamente: Linux (.deb, .rpm, .AppImage),
    Windows (.msi, .exe NSIS) y macOS (.dmg para Intel y Apple Silicon).
    Los artefactos de Linux se construyen sobre Ubuntu 22.04 (glibc 2.35):
    funcionan en Ubuntu 22.04+, Debian 12+, Fedora 36+ y equivalentes;
    en Arch Linux y otras distribuciones usa el .AppImage.
    Requieren Java (JDK 17+), Python 3.9+ o kotlinc según el lenguaje que emplees.

jobs:
  linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    timeout-minutes: 30

    steps:
      - name: Dependencias de sistema (Ubuntu 22.04)
        run: |
          apt-get update
          apt-get install -y curl wget git ca-certificates xz-utils file sudo \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf rpm

      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v4

      - uses: actions/setup-node@7f84f1d52d0c56afb45c62fee31a93b843cea4d6  # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable

      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@a6e90ddc4ba4721f294e52b856d3d50e645edc07  # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: ideCode __VERSION__
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          args: --bundles deb,rpm,appimage

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles msi,nsis
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
          - platform: macos-latest
            args: --bundles dmg
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v4

      - uses: actions/setup-node@7f84f1d52d0c56afb45c62fee31a93b843cea4d6  # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable

      - name: Target de Rust para macOS Intel
        if: contains(matrix.args, 'x86_64-apple-darwin')
        run: rustup target add x86_64-apple-darwin

      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@a6e90ddc4ba4721f294e52b856d3d50e645edc07  # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: ideCode __VERSION__
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
