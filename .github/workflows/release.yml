name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_BODY: >-
    Binarios generados automáticamente: Linux (.deb, .rpm, .AppImage),
    Windows (.msi, .exe NSIS) y macOS (.dmg para Intel y Apple Silicon).
    Los artefactos de Linux se construyen sobre Ubuntu 22.04 (glibc 2.35):
    funcionan en Ubuntu 22.04+, Debian 12+, Fedora 36+ y equivalentes;
    en Arch Linux y otras distribuciones usa el .AppImage.
    Requieren Java (JDK 17+), Python 3.9+ o kotlinc según el lenguaje que emplees.

jobs:
  linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:
      - name: Dependencias de sistema (Ubuntu 22.04)
        run: |
          apt-get update
          apt-get install -y curl wget git ca-certificates xz-utils file sudo \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf rpm

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: ideCode __VERSION__
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          args: --bundles deb,rpm,appimage

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles msi,nsis
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
          - platform: macos-latest
            args: --bundles dmg
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Target de Rust para macOS Intel
        if: contains(matrix.args, 'x86_64-apple-darwin')
        run: rustup target add x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: ideCode __VERSION__
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
