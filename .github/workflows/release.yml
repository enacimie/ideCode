name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: --bundles deb,rpm,appimage
          - platform: windows-latest
            args: --bundles msi,nsis
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
          - platform: macos-latest
            args: --bundles dmg
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Target de Rust para macOS Intel
        if: contains(matrix.args, 'x86_64-apple-darwin')
        run: rustup target add x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: ideCode __VERSION__
          releaseBody: >-
            Binarios generados automáticamente: Linux (.deb, .rpm, .AppImage),
            Windows (.msi, .exe NSIS) y macOS (.dmg para Intel y Apple Silicon).
            En Arch Linux y otras distribuciones usa el .AppImage.
            Requieren Java (JDK 17+), Python 3.9+ o Kotlin según el lenguaje que emplees.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
